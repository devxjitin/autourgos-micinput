[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-micinput"
version = "0.1.1"
description = "Standalone, provider-agnostic microphone capture for the Autourgos framework -- MicrophoneStream, usable by autourgos-live, autourgos-openaichat, autourgos-responses, autourgos-agent, or any other caller."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com" },
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = [
    "autourgos", "microphone", "audio", "mic", "capture",
    "llm", "ai", "agent", "voice", "speech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "autourgos-core>=0.2.0",
]

[project.optional-dependencies]
mic = [
    "sounddevice>=0.4.6",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "sounddevice>=0.4.6",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-micinput"
Repository = "https://github.com/devxjitin/autourgos-micinput"
Issues = "https://github.com/devxjitin/autourgos-micinput/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_micinput*"]

[tool.setuptools.package-data]
autourgos_micinput = ["py.typed"]
